<div class="shell">
  <header class="top">
    <div class="left">
      <button class="menu" type="button" (click)="open.set(!open())" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <a routerLink="/recruiter/post-job" class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="7" width="20" height="14" rx="3" fill="#4F46E5" />
          <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7" fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round" />
          <path d="M2 12.5h20" stroke="#fff" stroke-width="1.8" />
          <path d="M10 16h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>QuickHire</span>
      </a>
    </div>

    <div class="user">
      <span class="avatar" aria-hidden="true">{{ initials }}</span>
      <span class="name">{{ userName }}</span>
      <button type="button" class="logout" (click)="logout()">Log out</button>
    </div>
  </header>

  <div class="body">
    <aside class="side" [class.open]="open()">
      <nav aria-label="Main">
        <a routerLink="/dashboard" routerLinkActive="active" (click)="open.set(false)">Dashboard</a>
        <a routerLink="/employees" routerLinkActive="active" (click)="open.set(false)">Employees</a>
        <a routerLink="/departments" routerLinkActive="active" (click)="open.set(false)">Departments</a>
        <a routerLink="/recruiter/post-job" routerLinkActive="active" (click)="open.set(false)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" />
          </svg>
          Post a Job
        </a>
        <a routerLink="/recruiter/jobs" routerLinkActive="active" (click)="open.set(false)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="7" width="18" height="13" rx="2" /><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18" />
          </svg>
          My Jobs
        </a>
        <a routerLink="/recruiter/applicants" routerLinkActive="active" (click)="open.set(false)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="8" r="3" /><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5.5a3 3 0 0 1 0 5.8M18 14a5 5 0 0 1 3 4.5V20" />
          </svg>
          Applicants
        </a>
      </nav>
    </aside>

    @if (open()) {
      <div class="scrim" (click)="open.set(false)"></div>
    }

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
