<svg
  class="auth__art"
  viewBox="0 0 420 320"
  role="img"
  aria-label="A person sitting at a desk working on a laptop"
>
  <defs>
    <linearGradient id="qh-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="qh-pants" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="qh-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
  </defs>

  <!-- chair back -->
  <rect x="292" y="150" width="18" height="120" rx="9" fill="#C7D2FE" />
  <rect x="292" y="150" width="86" height="16" rx="8" fill="#C7D2FE" />

  <!-- desk -->
  <rect x="52" y="212" width="300" height="12" rx="6" fill="#A5B4FC" />
  <rect x="70" y="224" width="10" height="56" rx="5" fill="#A5B4FC" />
  <rect x="324" y="224" width="10" height="56" rx="5" fill="#A5B4FC" />

  <!-- person: legs -->
  <path d="M168 232h74l6 48h-30l-14-30-6 30h-30z" fill="url(#qh-pants)" />

  <!-- person: torso -->
  <path
    d="M150 232v-56c0-22 18-40 40-40h14c22 0 40 18 40 40v56z"
    fill="url(#qh-shirt)"
  />

  <!-- person: head -->
  <circle cx="212" cy="112" r="26" fill="#FDE3C8" />
  <path
    d="M186 108a26 26 0 0 1 52 0v-4a26 26 0 0 0-52 0z"
    fill="#3F2E1F"
  />
  <path d="M186 104a26 26 0 0 1 52 0v-6c0-14-12-24-26-24s-26 10-26 24z" fill="#3F2E1F" />

  <!-- person: arm reaching to the keyboard -->
  <path
    d="M250 168c22 6 34 18 40 34"
    fill="none"
    stroke="url(#qh-shirt)"
    stroke-width="15"
    stroke-linecap="round"
  />
  <circle cx="292" cy="206" r="8" fill="#FDE3C8" />

  <!-- laptop -->
  <path d="M228 158h84a6 6 0 0 1 6 6l-6 46h-90l-6-46a6 6 0 0 1 6-6z" fill="#4F46E5" />
  <path d="M234 164h72l5 40h-82z" fill="url(#qh-screen)" />
  <rect x="252" y="174" width="40" height="5" rx="2.5" fill="#C7D2FE" />
  <rect x="252" y="185" width="26" height="5" rx="2.5" fill="#C7D2FE" />
  <path d="M214 210h116l10 10H204z" fill="#4338CA" />

  <!-- floating cards -->
  <g opacity="0.9">
    <rect x="66" y="52" width="86" height="30" rx="8" fill="#FFFFFF" />
    <circle cx="84" cy="67" r="6" fill="#22C55E" />
    <rect x="98" y="63" width="42" height="8" rx="4" fill="#C7D2FE" />
  </g>
  <g opacity="0.85">
    <rect x="286" y="34" width="96" height="32" rx="8" fill="#FFFFFF" />
    <rect x="300" y="45" width="30" height="8" rx="4" fill="#4F46E5" />
    <rect x="336" y="45" width="32" height="8" rx="4" fill="#C7D2FE" />
  </g>
  <g opacity="0.75">
    <circle cx="72" cy="140" r="16" fill="#C7D2FE" />
    <circle cx="352" cy="120" r="10" fill="#C7D2FE" />
  </g>
</svg>
